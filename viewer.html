<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council-debatviewer</title>
<style>
  @font-face {
    font-family: "Pixelify Sans";
    src: url("assets/pixelify-sans.ttf") format("truetype");
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
  }
  :root {
    color-scheme: dark;
    --pixel: "Pixelify Sans", ui-monospace, monospace;
    --bg: #101416; --paneel: #181e20; --tekst: #f2ebdc; --zacht: #b6b8af; --lijn: #343b3b;
    --waarschuwing: #e3b86c; --fout: #ff9694; --ok: #a7d398;
    --archmage: #bba7fa; --engineer: #edb779; --guardian_keeper: #91c0df; --historian: #e6c598;
    --oracle: #d0b4f0; --beast_master: #a7d398; --koning: #f4ce79; --mens: #ff9694;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tekst); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body {
    background:
      linear-gradient(180deg, #10151e40, #101416b5 72%),
      repeating-linear-gradient(0deg, #293441 0 1px, transparent 1px 18px),
      conic-gradient(from 90deg at 1px 50%, transparent 90deg, #293441 0 180deg, transparent 0) 0 0 / 56px 36px,
      conic-gradient(from 180deg at 1px 50%, transparent 90deg, #293441 0 180deg, transparent 0) 28px 0 / 56px 36px,
      #171e29;
  }
  header {
    display: grid; grid-template-columns: minmax(12px, 1fr) auto minmax(12px, 1fr);
    gap: clamp(8px, 2vw, 22px); align-items: center; padding: 25px 0 17px;
  }
  .titelpijl { height: clamp(12px, 2.3vw, 27px); background: linear-gradient(#f5d692, #af773e 51%, #e2aa57 52%, #7f522e); }
  .titelpijl.veren { clip-path: polygon(0 8%, 20% 8%, 33% 44%, 100% 44%, 100% 59%, 33% 59%, 20% 93%, 0 93%, 13% 53%); }
  .titelpijl.punt { clip-path: polygon(0 44%, 76% 44%, 76% 10%, 100% 51%, 76% 91%, 76% 59%, 0 59%); }
  .zaalbediening { display: flex; justify-content: center; padding: 15px 0 22px; }
  .pitchlink { font: 600 14px var(--pixel); color: var(--koning); }
  button {
    --schild: polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% 66%, 85% 86%, 50% 100%, 15% 86%, 0 66%);
    position: relative; isolation: isolate; cursor: pointer; border: 0; background: none; color: #fff1d9;
    font: 600 15px/1.2 var(--pixel); padding: 9px 17px 13px;
  }
  button::before, button::after { content: ""; position: absolute; inset: 0; clip-path: var(--schild); z-index: -1; }
  button::before { background: #aa834a; }
  button::after { inset: 2px; background: linear-gradient(160deg, #354050, #22252d 70%); }
  button:hover::after { background: linear-gradient(160deg, #505f70, #2a303a 70%); }
  button:focus-visible, #debat:focus-visible { outline: 2px solid var(--koning); outline-offset: 3px; }
  .dossier { position: fixed; inset: 0 0 0 auto; margin: 0; height: 100%; max-height: none; width: min(850px, 100%); max-width: none; border: 0; border-left: 1px solid var(--lijn); color: var(--tekst); background: var(--bg); padding: 0 18px 18px; overflow: auto; }
  .dossier::backdrop { background: #080a0bb3; }
  .dossierkop { position: sticky; top: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--bg); border-bottom: 1px solid var(--lijn); padding: 14px 0 10px; margin-bottom: 12px; z-index: 1; }
  .dossierkop h2 { font: 600 24px var(--pixel); margin: 0; }
  header h1 { font: 700 clamp(21px, 4.7vw, 48px)/1 var(--pixel); margin: 0; text-align: center; text-shadow: 2px 3px #080a11; }
  .runid { color: var(--zacht); font-size: 12px; font-family: ui-monospace, monospace; word-break: break-all; }
  .pagina { width: min(1580px, calc(100% - 40px), calc(max(400px, 100svh - 238px) * 1.78)); margin: 0 auto; }
  .kamer { margin: 0 auto; border: 1px solid #534534; border-radius: 12px; overflow: hidden; background: #1a1717; }
  .toneel { position: relative; isolation: isolate; background: #181a20; }
  .zaal { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .zaallicht { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }
  .torengloed {
    position: absolute; left: 51.2%; top: 16%; width: 27%; height: 35%; translate: -50% -45%;
    background: radial-gradient(ellipse, #62d9fc70, #2b86d02a 42%, transparent 70%);
    animation: toren 8s ease-in-out infinite;
  }
  .torenring {
    position: absolute; left: 51.6%; top: 13.1%; width: 9%; height: 3%;
    translate: -50% -50%; border: 1px solid #74eaff; border-radius: 50%; box-shadow: 0 0 9px #37c9fa;
    animation: torenring 8s ease-out infinite;
  }
  .vlam {
    position: absolute; left: var(--licht-x); top: var(--licht-y); width: var(--licht-breedte, 7%); height: var(--licht-hoogte, 16%);
    translate: -50% -50%; transform-origin: 50% 58%;
    background: radial-gradient(ellipse, #ffb36977, #de6b241c 45%, transparent 69%);
    animation: flakker 2.3s steps(1, end) infinite; animation-delay: var(--licht-start);
  }
  .vlam::after {
    content: ""; position: absolute; width: 10%; height: 20%; left: 45%; top: 35%; background: #ffd17d;
    clip-path: polygon(50% 0, 55% 40%, 82% 27%, 100% 75%, 66% 100%, 22% 94%, 0 65%, 26% 49%);
  }
  @keyframes flakker {
    0%, 100% { opacity: .65; transform: scale(.9, 1); }
    15% { opacity: .89; transform: scale(1.05, .94); }
    31% { opacity: .74; transform: scale(.86, 1.13); }
    53% { opacity: .4; transform: scale(.92, .88); }
    73% { opacity: .96; transform: scale(1, 1.1); }
    87% { opacity: .58; transform: scale(.9, .95); }
  }
  @keyframes toren { 0%, 100% { opacity: .22; } 45% { opacity: .84; } 72% { opacity: .4; } }
  @keyframes torenring {
    0%, 100% { opacity: 0; transform: scale(.95); }
    27% { opacity: .64; transform: scale(1); }
    67% { opacity: 0; transform: scale(1.32, 1.34); }
  }
  .raadskaart { position: absolute; inset: 0; margin: 0; padding: 0; list-style: none; }
  .zitplaats { position: absolute; left: var(--x); top: var(--y); translate: -50% -100%; width: 8.5%; text-align: center; color: var(--rolkleur); }
  .sprite { position: relative; display: block; aspect-ratio: .5; background: var(--atlas, url(council-cast.png)) var(--frame) 50% / var(--atlas-breedte, 400%) 100% no-repeat; image-rendering: pixelated; }
  .nieuw-raadslid { --atlas: url(council-extra-cast.png); --atlas-breedte: 300%; }
  .nieuw-raadslid .naamplaat { top: 94%; }
  .zitplaats.spreekt { z-index: 2; }
  .spreekwolk {
    position: absolute; z-index: 4; left: 50%; bottom: 91%; translate: -50% 0;
    width: clamp(130px, 20vw, 240px); padding: 8px 11px; background: #fff0cf; color: #28202a;
    border: 2px solid #57445b; box-shadow: 3px 3px 0 #13131d; text-align: left;
    font: 600 clamp(12px, 1.4vw, 17px)/1.13 var(--pixel); overflow-wrap: anywhere;
    animation: wolk-in 180ms ease-out;
  }
  .zijplaats.links .spreekwolk { translate: -24% 0; --staart-x: 24%; }
  .zijplaats.rechts .spreekwolk { translate: -76% 0; --staart-x: 76%; }
  .spreekwolk::after { content: ""; position: absolute; left: calc(var(--staart-x, 50%) - 6px); bottom: -7px; width: 10px; height: 10px; rotate: 45deg; border: solid #57445b; border-width: 0 2px 2px 0; background: #fff0cf; }
  .spreekwolk small { display: block; margin-top: 4px; color: #563c6b; font-size: .84em; }
  @keyframes wolk-in { from { opacity: 0; transform: translateY(4px) scale(.96); } to { opacity: 1; transform: none; } }
  .naamplaat { position: absolute; top: 89%; left: 50%; translate: -50% 0; background: #141416e8; border: 1px solid #80705a; border-radius: 3px; padding: 1px 5px; font: 600 clamp(9px, 1.25vw, 15px)/1.25 var(--pixel); white-space: nowrap; }
  .zitplaats[aria-current="true"] .naamplaat { border-color: currentColor; box-shadow: 0 0 10px currentColor; }
  .zitplaats[aria-current="true"] .sprite { animation: spreek 1.55s ease-in-out infinite; filter: drop-shadow(0 0 5px var(--rolkleur)); }
  .zitplaats.wijst .sprite { animation: wijs 730ms ease-in-out; filter: drop-shadow(0 0 7px var(--koning)); }
  @keyframes spreek { 0%, 72%, 100% { transform: translateY(0); } 45% { transform: translateY(-2.5%); } }
  @keyframes wijs { 0%, 100% { transform: translate(0, 0); } 45% { transform: translateY(-7%) scale(1.04); } }
  .koningsrol {
    position: absolute; z-index: 5; left: 22%; top: 58%; width: 56%; height: 15%; min-height: 13px;
    rotate: -12deg; border: 2px solid #754519; border-radius: 3px; padding: 0;
    background: linear-gradient(#ffefba, #e2ab5d 48%, #ae6838 56%, #e6b06d 68%, #b47a44);
    box-shadow: 0 0 0 2px #fff2b0, 0 0 12px 3px #ffda83, 0 0 31px 12px #ffc14c91;
    animation: rolgloed 2.5s ease-in-out infinite;
  }
  .koningsrol::before, .koningsrol::after { clip-path: none; inset: 0 39%; background: #9c3c36; }
  .koningsrol::after { inset: 26% 38%; background: #bd5847; box-shadow: 0 1px #73301f; }
  .koningsrol:hover { box-shadow: 0 0 0 3px #fff6cc, 0 0 16px 5px #ffe199, 0 0 38px 15px #ffc453bd; }
  .koningsrol:hover::after { background: #e87d62; }
  .rol-greep::before, .rol-greep::after {
    content: ""; position: absolute; top: 40%; width: 19%; height: 74%;
    border: 2px solid #3b241d; background: linear-gradient(#f3c497 0 45%, #c08061 46%);
    clip-path: polygon(28% 0, 75% 0, 75% 20%, 100% 20%, 100% 70%, 75% 70%, 75% 100%, 0 100%, 0 26%, 28% 26%);
  }
  .rol-greep::before { left: -7%; }
  .rol-greep::after { right: -7%; scale: -1 1; }
  @keyframes rolgloed {
    50% { box-shadow: 0 0 0 3px #fff6cc, 0 0 18px 6px #ffe199, 0 0 43px 16px #ffc453ba; }
  }
  .perkament {
    width: min(950px, calc(100% - 24px)); height: min(84svh, 650px); max-height: none;
    border: 0; color: #40261a; color-scheme: light; overflow: hidden;
    background: transparent; isolation: isolate;
    padding: clamp(55px, 10svh, 94px) clamp(28px, 8vw, 99px) clamp(45px, 9svh, 88px);
    filter: drop-shadow(0 10px 24px #090604bf);
  }
  .perkament::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: url(verdict-parchment.png) center / 100% 100% no-repeat;
    clip-path: polygon(2.1% 2.8%, 97.9% 2.8%, 99% 5%, 99% 11%, 97.3% 13%, 97.3% 30%,
      98% 48%, 97.3% 64%, 97.7% 87%, 99% 89%, 99% 96%, 97.5% 98%, 2.1% 98%,
      1% 95%, 1% 89%, 2.2% 87%, 2.5% 68%, 2% 53%, 2.5% 39%, 2.3% 13%, 1% 11%, 1% 5%);
  }
  .perkament[open] { display: flex; flex-direction: column; animation: ontvouw 750ms cubic-bezier(.19,.75,.3,1) both; }
  .roltekst { min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-color: #8c643a transparent; padding-right: 6px; }
  .perkament::backdrop { background: #100906b8; }
  .perkamentkop { flex: none; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-bottom: 2px solid #a66c4066; padding-bottom: 13px; margin-bottom: 15px; }
  .perkamentkop h2 { margin: 0; font: 700 clamp(24px, 5vw, 39px)/1 var(--pixel); }
  .perkament .slot { margin: 0 0 15px; font-size: 15px; }
  .perkament .slot b { color: #694028; }
  .perkament .leeg { color: #6f4f3b; }
  .perkament .id { --kleur-id: #5d315c !important; background: #5d315c16; }
  @keyframes ontvouw {
    from { clip-path: inset(48% 0); opacity: .65; }
    to { clip-path: inset(0 -20% -50%); opacity: 1; }
  }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(270px, 32%); gap: 18px; }
  .debatkop { margin: 0 0 7px; font: 600 23px var(--pixel); }
  #debat { max-height: 68vh; overflow: auto; overscroll-behavior: contain; }
  #debat .ronde:first-child { margin-top: 0; }
  aside .runid { margin: 0 0 10px; }
  @media (max-width: 720px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .naamplaat { padding-inline: 2px; }
    .perkament { padding-inline: clamp(25px, 7.5vw, 58px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sprite, .spreekwolk, .koningsrol, .perkament, .vlam, .torengloed, .torenring, .denkt { animation: none !important; }
    .vlam, .torengloed { opacity: .3; }
    .torenring { display: none; }
  }
  .ronde { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--zacht); }
  .beurt { background: var(--paneel); border: 1px solid var(--lijn); border-left: 4px solid var(--kleur); border-radius: 10px; padding: 10px 14px; margin: 8px 0; }
  .beurt .wie { font-weight: 650; color: var(--kleur); font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .beurt .nr { color: var(--zacht); font-weight: 400; font-size: 12px; }
  .beurt .tekst { margin-top: 4px; overflow-wrap: anywhere; }
  .klein { background: transparent; border-style: dashed; padding: 6px 12px; font-size: 13px; color: var(--zacht); }
  .klein code { color: var(--tekst); }
  .vlag { color: var(--fout); font-weight: 600; font-size: 12px; }
  .id { display: inline-block; font-family: ui-monospace, monospace; font-size: 12px; padding: 0 5px; border-radius: 5px; background: color-mix(in srgb, var(--kleur-id) 16%, transparent); color: var(--kleur-id); border: 1px solid color-mix(in srgb, var(--kleur-id) 40%, transparent); }
  .id.raar { outline: 2px dotted var(--waarschuwing); }
  .denkt { border-style: dashed; animation: puls 1.4s ease-in-out infinite; }
  @keyframes puls { 50% { opacity: .55; } }
  aside section { background: var(--paneel); border: 1px solid var(--lijn); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--zacht); margin: 0 0 8px; }
  .lid { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; font-size: 14px; padding: 2px 0; }
  .stip { width: 12px; height: 12px; border-radius: 50%; background: var(--kleur); }
  .getal { color: var(--zacht); font-size: 12px; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  td { padding: 2px 0; } td:last-child { text-align: right; }
  .check { font-size: 13px; padding: 2px 0; }
  .check.ok::before { content: "✓ "; color: var(--ok); }
  .check.fout::before { content: "✗ "; color: var(--fout); }
  .check.let::before { content: "! "; color: var(--waarschuwing); }
  .slot { margin: 6px 0; font-size: 13px; }
  .slot b { display: block; font-size: 12px; color: var(--zacht); text-transform: uppercase; letter-spacing: .05em; }
  .leeg { color: var(--zacht); font-style: italic; }
  ol { padding-left: 18px; margin: 4px 0; font-size: 13px; }
  .melding { padding: 28px 16px; text-align: center; color: var(--zacht); }
</style>
</head>
<body>
<div class="pagina">
<header>
  <span class="titelpijl veren" aria-hidden="true"></span>
  <h1>Council of Achrona</h1>
  <span class="titelpijl punt" aria-hidden="true"></span>
</header>
<figure class="kamer">
  <div class="toneel">
    <img class="zaal" src="council-chamber.png" alt="Raadszaal van Achrona in pixelkunst.">
    <div class="zaallicht" aria-hidden="true">
      <span class="torengloed"></span><span class="torenring"></span>
      <span class="vlam" style="--licht-x:20.4%;--licht-y:20.1%;--licht-start:-.2s"></span>
      <span class="vlam" style="--licht-x:25.6%;--licht-y:18.4%;--licht-start:-1.3s"></span>
      <span class="vlam" style="--licht-x:36.6%;--licht-y:18.6%;--licht-start:-.8s"></span>
      <span class="vlam" style="--licht-x:63.4%;--licht-y:18.6%;--licht-start:-1.8s"></span>
      <span class="vlam" style="--licht-x:74.5%;--licht-y:18.4%;--licht-start:-.4s"></span>
      <span class="vlam" style="--licht-x:79.6%;--licht-y:20.1%;--licht-start:-1.1s"></span>
      <span class="vlam" style="--licht-x:4.3%;--licht-y:79.5%;--licht-breedte:13%;--licht-hoogte:25%;--licht-start:-.6s"></span>
      <span class="vlam" style="--licht-x:95.6%;--licht-y:79.5%;--licht-breedte:13%;--licht-hoogte:25%;--licht-start:-2s"></span>
    </div>
    <ul class="raadskaart" aria-label="Zitplaatsen van de Raad">
      <li class="zitplaats nieuw-raadslid" data-rol="archmage" style="--rolkleur:var(--archmage);--x:26%;--y:50%;--frame:0%"><span class="sprite" aria-hidden="true"></span><span class="naamplaat">Archmage</span></li>
      <li class="zitplaats" data-rol="engineer" style="--rolkleur:var(--engineer);--x:38%;--y:50%;--frame:33.333%"><span class="sprite" aria-hidden="true"></span><span class="naamplaat">Engineer</span></li>
      <li class="zitplaats" data-rol="koning" style="--rolkleur:var(--koning);--x:50%;--y:50%;--frame:66.667%"><span class="sprite" aria-hidden="true"></span><span class="naamplaat">Koning</span><button id="open-verdictrol" class="koningsrol" type="button" aria-haspopup="dialog" aria-label="Open de verdictrol" title="Open de verdictrol" hidden><span class="rol-greep" aria-hidden="true"></span></button></li>
      <li class="zitplaats" data-rol="oracle" style="--rolkleur:var(--oracle);--x:62%;--y:50%;--frame:100%"><span class="sprite" aria-hidden="true"></span><span class="naamplaat">Oracle</span></li>
      <li class="zitplaats nieuw-raadslid" data-rol="historian" style="--rolkleur:var(--historian);--x:74%;--y:50%;--frame:50%"><span class="sprite" aria-hidden="true"></span><span class="naamplaat">Historian</span></li>
      <li class="zitplaats zijplaats links" data-rol="beast_master" style="--rolkleur:var(--beast_master);--x:12%;--y:65%;--frame:0%"><span class="sprite" aria-hidden="true"></span><span class="naamplaat">Beast Master</span></li>
      <li class="zitplaats nieuw-raadslid zijplaats rechts" data-rol="guardian_keeper" style="--rolkleur:var(--guardian_keeper);--x:88%;--y:65%;--frame:100%"><span class="sprite" aria-hidden="true"></span><span class="naamplaat">Guardian Keeper</span></li>
    </ul>
  </div>
</figure>
<div class="zaalbediening">
  <button id="open-dossier" type="button" aria-haspopup="dialog">Debat en verdict</button>
</div>
<dialog id="verdictrol" class="perkament" aria-labelledby="verdictrol-titel">
  <div class="perkamentkop">
    <h2 id="verdictrol-titel">Oordeel van de Raad</h2>
    <form method="dialog"><button type="submit" autofocus>Sluiten</button></form>
  </div>
  <div id="rol-inhoud" class="roltekst" tabindex="0"></div>
</dialog>
<dialog id="dossier" class="dossier" aria-labelledby="dossier-titel">
  <div class="dossierkop">
    <h2 id="dossier-titel">Raadsdossier</h2>
    <a class="pitchlink" href="/pitch">Open bewijsweergave</a>
    <form method="dialog"><button type="submit">Sluiten</button></form>
  </div>
<main>
  <section aria-labelledby="debatkop">
    <h2 id="debatkop" class="debatkop">Debat</h2>
    <div id="debat" tabindex="0"><p class="melding">Start de Council met <code>uv run council</code>.</p></div>
  </section>
  <aside>
    <p id="runid" class="runid"></p>
    <section><h2>Council Verdict</h2><div id="verdict"><span class="leeg">Wacht op verdict</span></div></section>
    <section><h2>Raadsleden</h2><div id="leden"></div></section>
    <section><h2>Spelregels</h2><div id="checks"></div></section>
    <section><h2>Verbruik</h2><div id="verbruik"></div></section>
  </aside>
</main>
</dialog>
</div>
<script>
const NAMEN = { archmage: "Archmage", engineer: "Engineer", guardian_keeper: "Guardian Keeper", historian: "Historian",
  oracle: "Oracle", beast_master: "Beast Master", koning: "Koning", mens: "Mens" };
const BEURTENBUDGET = 10;
const PREFIX = { ARC: "archmage", ENG: "engineer", GUA: "guardian_keeper", HIS: "historian", ORA: "oracle", BEA: "beast_master" };
const ID_RE = /\b(ARC|ENG|GUA|HIS|ORA|BEA)([-\u2010-\u2015\u2212])(\d{3})\b/g;
let vorige = "";

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kleur = rol => `var(--${NAMEN[rol] ? rol : "koning"})`;

function opmaak(tekst) {
  return esc(tekst)
    .replace(/^#{1,4}\s*(.+)$/gm, "<strong>$1</strong>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(ID_RE, (m, p, streep, n) => {
      const raar = streep !== "-";
      return `<span class="id${raar ? " raar" : ""}" style="--kleur-id:${kleur(PREFIX[p])}" title="${raar ? "Geen gewoon koppelteken: dit ID faalt op het schema" : NAMEN[PREFIX[p]]}">${p}-${n}</span>`;
    })
    .replace(/\n/g, "<br>");
}

function ids(tekst) {
  return [...String(tekst ?? "").matchAll(ID_RE)].map(m => ({ id: `${m[1]}-${m[3]}`, raar: m[2] !== "-" }));
}

const plaatsen = [...document.querySelectorAll(".zitplaats")];
const koning = plaatsen.find(plaats => plaats.dataset.rol === "koning");
let vorigeKeuze = "";
koning.addEventListener("animationend", event => {
  if (event.animationName === "wijs") koning.classList.remove("wijst");
});

function renderKamer(trace, beurten, bezig) {
  const laatste = beurten.at(-1);
  const keuze = beurten.findLast(beurt => beurt.soort === "routering");
  const actief = bezig ? (laatste?.soort === "routering" ? laatste.aan || "koning" : trace.aan_het_woord) : null;
  for (const plaats of plaatsen) {
    plaats.setAttribute("aria-current", String(plaats.dataset.rol === actief));
  }
  const keuzeId = keuze && `${trace.run_id}:${keuze.nr}`;
  if (bezig && keuzeId && keuzeId !== vorigeKeuze && keuze.spreker === "koning") {
    koning.classList.add("wijst");
  }
  vorigeKeuze = keuzeId;
}

let wolkRun;
let wolkNr = 0;
let wolkTimer;
let wolkRij = [];

function toonSpreekwolk(beurt) {
  for (const plaats of plaatsen) {
    plaats.classList.remove("spreekt");
    plaats.querySelector(".spreekwolk")?.remove();
  }
  if (!beurt) return;
  const plek = plaatsen.find(plaats => plaats.dataset.rol === beurt.spreker);
  if (!plek) return;
  const tekst = (beurt.soort === "routering" ? beurt.vraag : beurt.tekst) || "";
  const regel = tekst.replace(/[*#`]/g, "").replace(/^\s*(?:Koning|Engineer|Oracle|Beast Master|Archmage|Guardian Keeper|Historian):\s*/i, "")
    .trim().split(/(?<=[.!?])\s+|\n/)[0];
  if (!regel) return;
  const woorden = regel.split(/\s+/);
  const fragment = woorden.slice(0, 17).join(" ");
  const bronnen = [...new Set(ids(fragment).map(bron => bron.id))].slice(0, 2);
  const wolk = document.createElement("div");
  wolk.className = "spreekwolk";
  wolk.setAttribute("role", "status");
  wolk.textContent = fragment.replace(ID_RE, "").replace(/\(\s*\)/g, "").replace(/\s+([.,!?])/g, "$1").trim()
    + (woorden.length > 17 ? "…" : "");
  if (bronnen.length) {
    const citaten = document.createElement("small");
    citaten.textContent = bronnen.join(" · ");
    wolk.append(citaten);
  }
  plek.classList.add("spreekt");
  plek.append(wolk);
}

function speelWolken() {
  toonSpreekwolk(wolkRij.shift());
  wolkTimer = setTimeout(() => {
    wolkTimer = undefined;
    if (wolkRij.length) speelWolken();
  }, 2100);
}

function planSpreekwolk(trace, beurten, bezig) {
  if (wolkRun !== trace.run_id || !bezig) {
    clearTimeout(wolkTimer);
    wolkTimer = undefined;
    wolkRij = [];
    wolkNr = 0;
    wolkRun = trace.run_id;
    toonSpreekwolk(null);
  }
  if (!bezig) return;
  const nieuw = beurten.filter(beurt => beurt.nr > wolkNr
    && (beurt.soort === "bericht" || beurt.soort === "routering"));
  if (!nieuw.length) return;
  wolkRij.push(...(wolkNr ? nieuw : nieuw.slice(-1)));
  wolkNr = nieuw.at(-1).nr;
  if (!wolkTimer) speelWolken();
}

function render(trace, verdict) {
  const bezig = trace.status === "bezig";
  document.getElementById("runid").textContent = trace.run_id || "";

  // Debat per ronde
  const beurten = trace.beurten || [];
  renderKamer(trace, beurten, bezig);
  planSpreekwolk(trace, beurten, bezig);
  const verdictKlaar = trace.status === "klaar" && verdict?.run_id === trace.run_id
    && verdict.samenvatting?.trim() && verdict.samenvatting.trim() !== "TODO";
  document.getElementById("open-verdictrol").hidden = !verdictKlaar;
  const rol = document.getElementById("verdictrol");
  if (!verdictKlaar && rol.open) rol.close();
  let html = "", ronde = null;
  const telling = {}, padfouten = [], koningTools = [], vreemdeIds = [], zonderRoutering = [];
  let toegewezen = null, raadslidBeurten = 0;
  for (const b of beurten) {
    if (b.ronde !== ronde) {
      ronde = b.ronde;
      html += `<div class="ronde">${ronde === 0 ? "Voorbereiding" : b.spreker === "koning" && b.soort === "bericht" ? "Koning" : "Ronde " + ronde}</div>`;
    }
    const t = telling[b.spreker] ??= { berichten: 0, tools: 0, ids: new Set() };
    const stijl = `style="--kleur:${kleur(b.spreker)}"`;
    if (b.soort === "routering") {
      toegewezen = b.aan;
      const wie = `<span style="color:${kleur(b.spreker)}">${esc(NAMEN[b.spreker] || b.spreker)}</span>`;
      const open = (b.open_vragen || []).length ? `<br>Open vragen: ${b.open_vragen.map(v => opmaak(v)).join(" · ")}` : "";
      html += b.aan
        ? `<div class="beurt klein" ${stijl}>${wie} → <b style="color:${kleur(b.aan)}">${esc(NAMEN[b.aan] || b.aan)}</b>: ${opmaak(b.vraag)}<br>Waarom: ${opmaak(b.reden)}${open}</div>`
        : `<div class="beurt klein" ${stijl}>${wie} stopt het debat. Waarom: ${opmaak(b.reden)}${open}</div>`;
      continue;
    }
    if (b.soort === "bericht" && NAMEN[b.spreker] && !["koning", "mens"].includes(b.spreker)) {
      raadslidBeurten++;
      if (toegewezen !== b.spreker) zonderRoutering.push(b.nr);
      toegewezen = null;
    }
    if (b.soort === "bericht") {
      t.berichten++;
      for (const x of ids(b.tekst)) { t.ids.add(x.id); if (x.raar) vreemdeIds.push(x.id); }
      html += `<div class="beurt" ${stijl}><div class="wie">${esc(NAMEN[b.spreker] || b.spreker)}<span class="nr">#${b.nr}${b.aan ? " → " + esc(NAMEN[b.aan] || b.aan) : ""}</span></div><div class="tekst">${opmaak(b.tekst)}</div></div>`;
    } else {
      t.tools++;
      let vlag = "";
      if (b.soort === "toolcall") {
        if (b.spreker === "koning") { koningTools.push(b.nr); vlag = ` <span class="vlag">Koning leest een Kennisbron</span>`; }
        else if (b.pad && !b.pad.includes(`/${b.spreker}/`)) { padfouten.push(b.nr); vlag = ` <span class="vlag">pad van een andere Rol</span>`; }
      }
      if (b.soort === "bestand" && b.bestand && !b.bestand.startsWith(b.spreker + "/")) { padfouten.push(b.nr); vlag = ` <span class="vlag">bestand van een andere Rol</span>`; }
      const wat = b.soort === "toolcall"
        ? `🔎 <code>${esc(b.tool)}(${esc(Object.entries(b.argumenten || {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", "))})</code>`
        : `📄 <code>${esc(b.bestand)}</code> in de prompt`;
      html += `<div class="beurt klein" ${stijl}><span style="color:${kleur(b.spreker)}">${esc(NAMEN[b.spreker] || b.spreker)}</span> · ${wat}${vlag}</div>`;
    }
  }
  if (bezig && trace.aan_het_woord) {
    html += `<div class="beurt denkt" style="--kleur:${kleur(trace.aan_het_woord)}"><div class="wie">${esc(NAMEN[trace.aan_het_woord] || trace.aan_het_woord)}</div><div class="tekst leeg">denkt na…</div></div>`;
  }
  for (const g of trace.geschillen || []) {
    html += `<div class="ronde">Geschil</div><div class="beurt" style="--kleur:var(--koning)"><div class="wie">${esc(g.onderwerp)}</div><div class="tekst">${Object.entries(g.standpunten || {}).map(([r, s]) => `<b style="color:${kleur(r)}">${esc(NAMEN[r] || r)}</b>: ${opmaak(s)}`).join("<br>")}<br><b>Uitkomst:</b> ${g.uitkomst ? opmaak(g.uitkomst) : '<span class="leeg">niet beslecht</span>'} ${(g.bewijs || []).map(i => opmaak(i)).join(" ")}</div></div>`;
  }
  const debat = document.getElementById("debat");
  const onderaan = debat.clientHeight > 0 && debat.clientHeight + debat.scrollTop >= debat.scrollHeight - 80;
  debat.innerHTML = html || '<p class="melding">De run is gestart; de eerste beurt komt eraan.</p>';
  if (bezig && onderaan) debat.scrollTop = debat.scrollHeight;

  // Raadsleden
  document.getElementById("leden").innerHTML = [...(trace.raadsleden || []), "koning"].map(r => {
    const t = telling[r] || { berichten: 0, tools: 0, ids: new Set() };
    return `<div class="lid" style="--kleur:${kleur(r)}"><span class="stip"></span><span>${esc(NAMEN[r] || r)}</span><span class="getal">${t.berichten} ber · ${t.tools} bron · ${t.ids.size} ID's</span></div>`;
  }).join("");

  // Spelregels
  const zonderBron = (trace.raadsleden || []).filter(r => !(telling[r]?.tools));
  const checks = [
    [padfouten.length ? "fout" : "ok", padfouten.length ? `Kennisbron van een andere Rol gelezen (beurt ${padfouten.join(", ")})` : "Elk Raadslid las alleen de eigen Kennisbron"],
    [koningTools.length ? "fout" : "ok", koningTools.length ? `Koning las een Kennisbron (beurt ${koningTools.join(", ")})` : "Koning las geen Kennisbron"],
    [zonderBron.length ? "let" : "ok", zonderBron.length ? `Zonder bron: ${zonderBron.map(r => NAMEN[r] || r).join(", ")}` : "Elk Raadslid raadpleegde een bron"],
    [vreemdeIds.length ? "let" : "ok", vreemdeIds.length ? `ID's met een vreemd koppelteken: ${[...new Set(vreemdeIds)].join(", ")}` : "ID's in de juiste vorm"],
    [(trace.raadsleden || []).length >= 3 ? "ok" : "let", `${(trace.raadsleden || []).length} Rollen (minimum 3)`],
    [raadslidBeurten > BEURTENBUDGET ? "fout" : "ok", `${raadslidBeurten} van ${BEURTENBUDGET} Raadslid-beurten (Beurtenbudget)`],
    [zonderRoutering.length ? "fout" : "ok", zonderRoutering.length ? `Raadslid-beurt zonder Routering ervoor (beurt ${zonderRoutering.join(", ")})` : "Elke Raadslid-beurt had een Routering"],
  ];
  document.getElementById("checks").innerHTML = checks.map(([k, t]) => `<div class="check ${k}">${esc(t)}</div>`).join("");

  // Verbruik
  const v = trace.verbruik || {};
  document.getElementById("verbruik").innerHTML = Object.keys(v).length
    ? `<table>${Object.entries(v).map(([m, x]) => `<tr><td>${esc(m)} · ${x.beurten ?? x.calls} beurten</td><td>${(x.invoer || 0).toLocaleString("nl-BE")} in · ${(x.uitvoer || 0).toLocaleString("nl-BE")} uit</td></tr>`).join("")}</table>`
    : '<span class="leeg">nog geen calls</span>';

  // Verdict
  const vd = document.getElementById("verdict");
  if (!verdict || verdict.run_id !== trace.run_id) {
    vd.innerHTML = `<span class="leeg">${verdict ? "verdict.json hoort bij een andere run" : bezig ? "komt na de Koning" : "geen verdict.json"}</span>`;
  } else {
    const slot = (naam, s) => `<div class="slot"><b>${naam}</b>${s?.bewering ? opmaak(s.bewering) + " " + (s.bewijs || []).map(i => opmaak(i)).join(" ") + (typeof s.zekerheid === "number" ? ` · Zekerheid: ${Math.round(s.zekerheid * 100)}%` : "") : '<span class="leeg">onbekend (null)</span>'}</div>`;
    const o = verdict.oorzaak || {};
    vd.innerHTML = `<div class="slot"><b>Samenvatting</b>${verdict.samenvatting === "TODO" ? '<span class="leeg">TODO</span>' : opmaak(verdict.samenvatting)}</div>`
      + slot("Ingreep", o.ingreep) + slot("Mechanisme", o.mechanisme) + slot("Verloop", o.verloop)
      + `<div class="slot"><b>Herstelplan</b><ol>${(verdict.acties || []).map(a => `<li>${opmaak(a.actie)}${a.reden ? " – " + opmaak(a.reden) : ""} ${(a.bewijs || []).map(opmaak).join(" ")}</li>`).join("")}</ol></div>`
      + (verdict.voorspelling ? `<div class="slot"><b>Voorspelling · Dag ${esc(verdict.voorspelling.dag)}</b>${opmaak(verdict.voorspelling.bewering)} ${(verdict.voorspelling.bewijs || []).map(opmaak).join(" ")}</div>` : "")
      + `<div class="slot"><b>Risico's</b><ol>${(verdict.risicos || []).map(r => `<li>${opmaak(r.risico)}${r.mitigatie ? " – " + opmaak(r.mitigatie) : ""}</li>`).join("")}</ol></div>`;
  }
  document.getElementById("rol-inhoud").innerHTML = verdictKlaar ? vd.innerHTML : "";
}

async function haal(pad) {
  try { const r = await fetch(pad, { cache: "no-store" }); return r.ok ? await r.text() : null; } catch { return null; }
}

async function lus() {
  const [t, v] = await Promise.all([haal("trace.json"), haal("verdict.json")]);
  if (t && t + (v || "") !== vorige) {
    try {
      render(JSON.parse(t), v ? JSON.parse(v) : null);
      vorige = t + (v || "");
    } catch { /* bestand half geschreven: volgende ronde opnieuw */ }
  }
  setTimeout(lus, 1500);
}
const dossier = document.getElementById("dossier");
document.getElementById("open-dossier").addEventListener("click", () => dossier.showModal());
document.getElementById("open-verdictrol").addEventListener("click", () => {
  document.getElementById("verdictrol").showModal();
});
lus();
</script>
